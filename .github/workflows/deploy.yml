name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          path: stellarkit-site

      - uses: actions/checkout@v4
        with:
          repository: andymagill/stellarkit-core
          path: stellarkit-core

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        working-directory: stellarkit-site
        run: pnpm install

      - name: Lint
        working-directory: stellarkit-site
        run: pnpm lint

      - name: Astro Check
        working-directory: stellarkit-site
        run: npx astro check

      - name: Build
        working-directory: stellarkit-site
        run: pnpm build

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        with:
          path: stellarkit-site

      - uses: actions/checkout@v4
        with:
          repository: andymagill/stellarkit-core
          path: stellarkit-core

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        working-directory: stellarkit-site
        run: pnpm install

      - name: Build
        working-directory: stellarkit-site
        run: pnpm build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./stellarkit-site/lighthouserc.json
        continue-on-error: true
